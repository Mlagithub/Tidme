name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build plugins & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugins (out-m2)
        run: node tools/build-plugins.cjs

      - name: Unit tests (pipeline headless)
        run: npm run test:unit

      - name: Study flow regression
        run: npm run test:study
